<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="main-container">
        <div class="logo-section">
            <img class="logo-back-img" src="img/plant.avif">

            <div class="absolute-div">
                <img class="logo-img" src="img/odin-lined.png">
                <p class="logo-text">ODIN</p>
            </div>

            <div class="div-credit">
                <p class="img-credit">Photo by <a href="https://unsplash.com/es/@haliewestphoto" target="_blank">Halie
                        West</a> on <a href="https://unsplash.com/es" target="_blank">Unsplash</a></p>
            </div>
        </div>
        <div class="form-section">
            <div class="top-section">
                <p class="para-one">
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>
                <p class="para-two">You <em>know</em> you want to.</p>
            </div>
            <div class="middle-section">
                <p>Let's do this!</p>
                <div class="data-input">
                    <div class="column-one">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name">
                        <label for="e-mail">EMAIL</label>
                        <input type="email" name="e-mail">
                        <label for="pass">PASSWORD</label>
                        <input type="password" name="pass">
                    </div>
                    <div class="column-two">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="number" name="phone-number">
                        <label for="confirm-pass">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-pass">
                    </div>
                </div>
            </div>
            <div class="bottom-section">
                <button id="create-account">Create Account</button>
                <p>Already have an account? Log in</p>
            </div>
        </div>
    </div>
</body>

</html>
